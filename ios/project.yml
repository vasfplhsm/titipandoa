name: TitipanDoaNative
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  TitipanDoaNative:
    type: application
    platform: iOS
    sources:
      - TitipanDoa/App
      - TitipanDoa/Shared
    dependencies:
      - target: TitipanDoaWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.TitipanDoa
        INFOPLIST_KEY_CFBundleDisplayName: Tumpang Doa
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Tumpang Doa
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: TitipanDoaNative
            CFBundleURLSchemes: [titipandoa-native]
  TitipanDoaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - TitipanDoa/Widgets
      - TitipanDoa/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.TitipanDoa.Widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Generated/Widget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
